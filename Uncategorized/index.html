<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未分類の動画 | YouTube Collection</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1050px;margin:auto;padding:36px 20px 80px}a{color:inherit}.back{color:#a5b4fc;text-decoration:none}h1{font-size:clamp(28px,5vw,44px);margin:26px 0 8px}p{color:#aab6cf}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}input,select{background:#18223a;border:1px solid #35435d;border-radius:12px;padding:13px;color:#fff;font:inherit}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}.card{background:#151e33;border:1px solid #2a3752;border-radius:18px;overflow:hidden}.thumb{display:block;aspect-ratio:16/9;background:#0f172a;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;text-shadow:0 2px 15px #000}.body{padding:18px}.body a{text-decoration:none;font-weight:700;line-height:1.6}.body a:hover{text-decoration:underline}.tag{display:inline-block;background:#2c3453;color:#c7d2fe;border-radius:999px;padding:5px 10px;font-size:12px;margin-top:14px}.empty{color:#cbd5e1}</style></head>
<body><main><a class="back" href="../">← コレクション一覧へ</a><h1>📥 未分類の動画</h1><p>タイトルやジャンルを確認中の動画を一時保管しています。動画を押すとYouTubeで開きます。</p><div class="bar"><input id="q" type="search" placeholder="動画名・ID・タグで検索" aria-label="動画検索"><select id="tag" aria-label="タグで絞り込み"><option value="">すべてのタグ</option></select></div><p id="count" role="status">読み込み中…</p><div id="grid" class="grid"></div></main>
<script>
let videos=[];const grid=document.querySelector('#grid'),q=document.querySelector('#q'),tag=document.querySelector('#tag'),count=document.querySelector('#count');
function render(){const term=q.value.trim().toLocaleLowerCase();const shown=videos.filter(v=>(!tag.value||(v.tags||[]).includes(tag.value))&&(!term||[v.title,v.url,...(v.tags||[])].join(' ').toLocaleLowerCase().includes(term)));grid.replaceChildren();for(const v of shown){const id=new URL(v.url).searchParams.get('v');const card=document.createElement('article');card.className='card';const thumb=document.createElement('a');thumb.className='thumb';thumb.href=v.url;thumb.target='_blank';thumb.rel='noopener noreferrer';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(id||'')+'/hqdefault.jpg';img.alt='動画サムネイル';img.loading='lazy';const play=document.createElement('span');play.className='play';play.textContent='▶';thumb.append(img,play);const body=document.createElement('div');body.className='body';const link=document.createElement('a');link.href=v.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=v.title;body.append(link);for(const t of v.tags||[]){const b=document.createElement('span');b.className='tag';b.textContent='#'+t;body.append(document.createElement('br'),b)}card.append(thumb,body);grid.append(card)}count.textContent=shown.length+'件表示 / 全'+videos.length+'件';if(!shown.length){const e=document.createElement('p');e.className='empty';e.textContent='該当する動画はありません。';grid.append(e)}}
fetch('./videos.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('データ形式が不正です');videos=data;for(const t of [...new Set(data.flatMap(v=>v.tags||[]))].sort()){const o=document.createElement('option');o.value=t;o.textContent='#'+t;tag.append(o)}render()}).catch(e=>count.textContent='動画を読み込めませんでした: '+e.message);q.addEventListener('input',render);tag.addEventListener('change',render);
</script></body></html>

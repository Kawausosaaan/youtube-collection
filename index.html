<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Collection</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202b51,#0b1020 65%);min-height:100vh;color:#f1f5ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1020px;margin:auto;padding:65px 22px}h1{font-size:clamp(32px,6vw,56px);letter-spacing:-.04em;margin:10px 0}p{color:#aab6cf;line-height:1.7}.eyebrow{color:#a5b4fc;font-size:13px;font-weight:800;letter-spacing:.16em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:18px;margin-top:36px}.card{display:block;background:#151e33;border:1px solid #32405b;border-radius:20px;padding:27px;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:#818cf8}.emoji{font-size:38px}.card h2{margin:15px 0 5px;font-size:23px}.count{color:#a5b4fc;font-size:14px;font-weight:700}.foot{margin-top:50px;font-size:13px}</style></head><body><main><div class="eyebrow">YOUR VIDEO LIBRARY</div><h1>🎬 YouTube Collection</h1><p>気になる動画を、ジャンルごとに。いつでも探せる自分だけのコレクション。</p><div class="grid"><a class="card" href="./Baseball/"><div class="emoji">⚾</div><h2>野球</h2><p>選手・技術・解説などの動画</p><span class="count" id="baseball">動画を読み込み中…</span></a><a class="card" href="./Uncategorized/"><div class="emoji">📥</div><h2>未分類</h2><p>タイトルやカテゴリを確認中の動画</p><span class="count" id="uncategorized">動画を読み込み中…</span></a></div><p class="foot">カテゴリは動画の追加に合わせて増やしていきます。</p></main><script>for(const [path,id] of [['Baseball','baseball'],['Uncategorized','uncategorized']])fetch('./'+path+'/videos.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>document.getElementById(id).textContent=v.length+'本の動画').catch(()=>document.getElementById(id).textContent='件数を取得できませんでした');</script></body></html>
